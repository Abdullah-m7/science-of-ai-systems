name: rcl-val-001-one-shot-launcher

on:
  push:
    tags:
      - run-rcl-val-001

permissions:
  contents: write
  issues: write

concurrency:
  group: stage003-controller-ledger
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/tags/run-rcl-val-001'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPOSITORY: Abdullah-m7/science-of-ai-systems
      ISSUE_NUMBER: '10'
      TRIAL_ID: RCL-VAL-001
      SUBJECT_LOGIN: Abdullah-m7
      CONTROLLER_TAG: sais-rcl-bound-controller-v1
      CONTROLLER_SHA: c899213eb5b3f68a77e399a9dd32a9f86a827824
      CONFIG_COMMIT: c899213eb5b3f68a77e399a9dd32a9f86a827824
      CONFIG_PATH: experiments/005-config-bound-controller/validation/CONFIG.json

    steps:
      - name: Checkout frozen controller code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_TAG }}
          path: code

      - name: Checkout exact validation configuration commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONFIG_COMMIT }}
          path: config-source

      - name: Verify frozen source commits
        shell: bash
        run: |
          test "$(git -C code rev-parse HEAD)" = "$CONTROLLER_SHA"
          test "$(git -C config-source rev-parse HEAD)" = "$CONFIG_COMMIT"

      - name: Verify dedicated issue is clean
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          issue = os.environ["ISSUE_NUMBER"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/{issue}/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "sais-rcl-validation-launcher",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comments = json.load(response)
          existing = [
              int(item["id"])
              for item in comments
              if str(item.get("body", "")).startswith("SAIS_RCL_")
          ]
          if existing:
              raise SystemExit(f"issue already contains RCL protocol comments: {existing}")
          print("DEDICATED_ISSUE_CLEAN")
          PY

      - name: Checkout signed controller ledger
        uses: actions/checkout@v4
        with:
          ref: controller-ledger
          path: ledger

      - name: Run frozen configuration-bound validation controller
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/rcl-bound"
          PYTHONPATH=code/src python -m sais.rcl_bound_controller \
            --trial-id "$TRIAL_ID" \
            --repository "$REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --subject-login "$SUBJECT_LOGIN" \
            --controller-code-sha "$CONTROLLER_SHA" \
            --config-file "config-source/$CONFIG_PATH" \
            --config-repository "$REPOSITORY" \
            --config-commit "$CONFIG_COMMIT" \
            --config-path "$CONFIG_PATH" \
            --ledger-dir ledger \
            --output "$RUNNER_TEMP/rcl-bound/trial-output.json" \
            --timeout-seconds 1200

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcl-val-001-${{ github.run_id }}
          path: ${{ runner.temp }}/rcl-bound/trial-output.json
          if-no-files-found: ignore
          retention-days: 90
