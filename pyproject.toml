[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "science-of-ai-systems"
version = "0.1.0"
description = "Research utilities for measuring deployed AI systems"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Abdullah Almohammedi"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
sais-mosaic = "sais.mosaic_cli:main"
sais-rcl-handoff = "sais.rcl_subject_handoff:main"
sais-rcl-sequential = "sais.rcl_sequential_analysis:main"
sais-provision-rcl-issues = "sais.rcl_issue_provision:main"
sais-rcl-registry = "sais.rcl_registry:main"
sais-rcl-pc = "sais.rcl_pc_analysis:main"
sais-collect-public = "sais.public_evidence:main"
sais-verify-freeze = "sais.freeze_manifest:main"
sais-rcl-bound-controller = "sais.rcl_bound_controller:main"
sais-collect-rcl-bound = "sais.rcl_bound_evidence:main"
